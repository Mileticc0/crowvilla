<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown House – mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Playfair+Display:ital@1&display=swap">
<style>
html,body,#map{margin:0;height:100%;background:#F8F6F2}
.leaflet-tile-pane{filter:grayscale(1) sepia(.18) contrast(.92) brightness(1.04)}
.leaflet-container{font-family:'Hanken Grotesk',system-ui,sans-serif;background:#F8F6F2}
.leaflet-control-attribution{background:rgba(248,246,242,.85)!important;color:#6B6E73;font-size:10px}
.leaflet-control-attribution a{color:#6B6E73}
.leaflet-bar{border:0!important;box-shadow:none!important}
.leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important;background:#fff;color:#23262B;border:1px solid rgba(35,38,43,.16)!important;font-weight:400;transition:background-color 160ms cubic-bezier(0.23,1,0.32,1)}
.leaflet-bar a:first-child{border-radius:4px 4px 0 0}.leaflet-bar a:last-child{border-radius:0 0 4px 4px;border-top:0!important}
@media (hover:hover) and (pointer:fine){.leaflet-bar a:hover{background:#F8F6F2}}
.pin{display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateY(-50%)}
.pin-dot{width:52px;height:52px;border-radius:999px;background:#23262B;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(194,162,94,.22)}
.pin-label{background:#fff;color:#23262B;padding:7px 12px;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.2em;white-space:nowrap;border:1px solid #C2A25E}
.place{display:flex;align-items:center;gap:8px;transform:translate(-7px,-7px);white-space:nowrap}
.place-dot{width:14px;height:14px;border-radius:999px;background:#A6553A;border:3px solid #fff;flex:none}
.place-label{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:17px;color:#23262B;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 8px #fff}
</style>
</head>
<body>
<div id="map"></div>
<script>
const VILLA = [43.6132, 20.8695];
const CENTER = [43.6237, 20.8956];
const map = L.map('map', { scrollWheelZoom: false, zoomControl: false, attributionControl: true });
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
const crown = '<svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="#C2A25E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3 15 L4.6 5 L9 9.6 L13 2.5 L17 9.6 L21.4 5 L23 15 Z"></path><path d="M3.5 18 H22.5"></path></svg>';
L.marker(VILLA, { icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="pin" style="width:160px;margin-left:-80px"><div class="pin-dot">' + crown + '</div><div class="pin-label">CROWN HOUSE</div></div>' }), keyboard: false }).addTo(map);
L.marker(CENTER, { icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="place"><span class="place-dot"></span><span class="place-label">Centar Vrnjačke Banje</span></div>' }), keyboard: false, interactive: false }).addTo(map);
L.polyline([VILLA, CENTER], { color: '#A6553A', weight: 1.5, dashArray: '4 6', opacity: .8 }).addTo(map);
map.fitBounds(L.latLngBounds([VILLA, CENTER]), { padding: [70, 90] });
map.on('click', () => map.scrollWheelZoom.enable());
map.on('mouseout', () => map.scrollWheelZoom.disable());
</script>
</body>
</html>
